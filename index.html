<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>HVAT Spring Calculator</title>
  <meta name="theme-color" content="#113051" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="wrap">

    <!-- Tabs + Info -->
    <div class="tabs">
      <button id="tabCalc" class="tab active">Пары → кг</button>
      <button id="tabPick" class="tab">Цель → пары</button>
      <button id="tabSimple" class="tab">Simple pick</button>
      <div class="spacer"></div>
    </div>

    <div class="row">
      <!-- TAB 1: Calculation -->
      <div id="viewCalc" class="card">
        <div id="reading" class="reading">
          <div>
            <span id="value" class="value">—</span>
            <span class="unit">кг</span>
          </div>
        </div>

        <div class="mode">
          <label><input type="radio" name="mode" value="double" checked> 2 пружины</label>
          <label><input type="radio" name="mode" value="single"> 1 пружина</label>
        </div>

        <div class="controls" id="controls">
          <div class="control">
            <div class="label"><span>Пружина I</span><b><span id="posI_label">—</span></b></div>
            <input id="posI" type="range" min="1" max="12" step="1" value="8" />
            <div id="ticksI" class="ticks"></div>
          </div>
          <div class="control" id="controlII">
            <div class="label"><span>Пружина II</span><b><span id="posII_label">—</span></b></div>
            <input id="posII" type="range" min="1" max="12" step="1" value="5" />
            <div id="ticksII" class="ticks"></div>
          </div>
        </div>

        <p id="hint" class="note" style="margin-top:6px"></p>
      </div>

      <!-- TAB 2: Pick by target -->
      <div id="viewPick" class="card hidden">
        <div class="label" style="margin-bottom:12px"><span>Подбор по цели</span></div>
        <div class="mode" style="margin-bottom:6px">
          <label><input type="radio" name="modePick" value="double" checked> 2 пружины</label>
          <label><input type="radio" name="modePick" value="single"> 1 пружина</label>
        </div>
        <div class="target" style="margin-bottom:8px">
          <input id="targetKg" type="number" min="5" max="130" step="0.1" placeholder="напр. 64.0" />
          <span class="muted">кг</span>
        </div>
        <div id="empty" class="muted">Укажи желаемую нагрузку — предложим варианты.</div>
        <div id="grid" class="grid" style="display:none"></div>
      </div>

      <!-- TAB 3: Simple pick -->
      <div id="viewSimple" class="card hidden">
        <div class="label" style="margin-bottom:12px"><span>Simple pick</span></div>
        <div class="muted" style="margin-bottom:10px">Тапни на вес, чтобы выбрать комбинацию.</div>
        <div id="comboTable" class="combo-table"></div>
        <div id="comboSelection" class="combo-selection muted">Выбор не сделан.</div>
        <div id="comboModal" class="combo-modal" aria-hidden="true">
          <div class="combo-modal__card" role="dialog" aria-modal="true" aria-labelledby="comboModalTitle">
            <div id="comboModalTitle" class="combo-modal__title">Комбинация</div>
            <div id="comboModalWeight" class="combo-modal__weight">—</div>
            <div class="combo-modal__positions">
              Пружины I: <span id="comboModalI">—</span> · II: <span id="comboModalII">—</span>
            </div>
            <div class="combo-modal__actions">
              <button id="comboModalClose" type="button" class="btn ghost">Отмена</button>
              <button id="comboModalSelect" type="button" class="btn primary">Выбрать</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="js/init.js"></script>

</body>
</html>
