<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>HVAT Spring Calculator</title>
  <meta name="theme-color" content="#bed8d9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="wrap">
    <header class="brand">
      <div class="brand-mark"><img src="icons/icon-192.png" alt="" width="40" height="40" /></div>
      <div>
        <div class="brand-name">HVAT</div>
        <div class="brand-caption">Калькулятор нагрузки</div>
      </div>
    </header>

    <!-- Tabs + Info -->
    <nav class="tabs" aria-label="Разделы калькулятора">
      <button id="tabCalc" class="tab active">Пары → кг</button>
      <button id="tabPick" class="tab">Цель → пары</button>
      <button id="tabSimple" class="tab">Simple pick</button>
    </nav>

    <div class="row">
      <!-- TAB 1: Calculation -->
      <div id="viewCalc" class="card">
        <div id="reading" class="reading">
          <div class="reading-caption">Расчёт нагрузки</div>
          <div class="reading-result">
            <span id="value" class="value">—</span>
            <span class="unit">кг</span>
          </div>
        </div>

        <div class="mode">
          <label><input type="radio" name="mode" value="double" checked> 2 пружины</label>
          <label><input type="radio" name="mode" value="single"> 1 пружина</label>
        </div>

        <div class="controls" id="controls">
          <div class="control">
            <div class="label"><span>Пружина I</span><b><span id="posI_label">—</span></b></div>
            <input id="posI" type="range" min="1" max="12" step="1" value="8" aria-label="Позиция пружины I" />
            <div id="ticksI" class="ticks"></div>
          </div>
          <div class="control" id="controlII">
            <div class="label"><span>Пружина II</span><b><span id="posII_label">—</span></b></div>
            <input id="posII" type="range" min="1" max="12" step="1" value="5" aria-label="Позиция пружины II" />
            <div id="ticksII" class="ticks"></div>
          </div>
        </div>

        <p id="hint" class="note"></p>
      </div>

      <!-- TAB 2: Pick by target -->
      <div id="viewPick" class="card hidden">
        <div class="card-title">Подбор по цели</div>
        <div class="mode">
          <label><input type="radio" name="modePick" value="double" checked> 2 пружины</label>
          <label><input type="radio" name="modePick" value="single"> 1 пружина</label>
        </div>
        <div class="target">
          <input id="targetKg" type="number" min="5" max="130" step="0.1" placeholder="напр. 64.0" aria-label="Целевая нагрузка в килограммах" />
          <span class="muted">кг</span>
        </div>
        <div id="empty" class="muted">Укажи желаемую нагрузку — предложим варианты.</div>
        <div id="grid" class="grid" style="display:none"></div>
      </div>

      <!-- TAB 3: Simple pick -->
      <div id="viewSimple" class="card hidden">
        <div class="card-title">Нагрузка, кг</div>
        <p id="comboGuide" class="combo-guide">Выберите нагрузку, чтобы сравнить ближайшие варианты.</p>
        <div id="comboTable" class="combo-table"></div>
      </div>
    </div>

  </div>

  <aside id="comboSelection" class="selection-dock hidden" aria-label="Выбранные пружины" aria-live="polite">
    <div class="selection-dock__inner">
      <div class="selection-metric">
        <span>Пружина I</span>
        <strong id="comboSpringI">—</strong>
      </div>
      <div class="selection-metric">
        <span>Пружина II</span>
        <strong id="comboSpringII">—</strong>
      </div>
      <div class="selection-metric">
        <span>Нагрузка</span>
        <strong id="comboForce">—</strong>
      </div>
    </div>
  </aside>

  <script type="module" src="js/init.js"></script>

</body>
</html>
